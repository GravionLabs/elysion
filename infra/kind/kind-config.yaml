kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: elysion
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: 'ingress-ready=true'
    extraPortMappings:
      # The ingress (Traefik, hostPort 80 inside the node) is reachable at http://localhost, the address the dev
      # Keycloak client already allows. Stop the compose stack's Traefik first (`pnpm dev:stack:down`).
      - containerPort: 80
        hostPort: 80
        protocol: TCP
