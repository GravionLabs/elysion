# Scrapes the stack on the compose network (docs/specs/gateway.md, "Logs and metrics"); started by
# docker-compose.observability.yml. To use your own Prometheus instead, copy the jobs and the rule file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ['traefik:8082']
  - job_name: bff
    static_configs:
      - targets: ['bff:3000']
  - job_name: realtime
    static_configs:
      - targets: ['realtime:3000']
  - job_name: business-backend
    static_configs:
      - targets: ['business-backend:8080']
  # The age of the last good backup (infra/backup writes backup.prom; node-exporter serves it, nothing else).
  - job_name: backup
    static_configs:
      - targets: ['backup-metrics:9100']
