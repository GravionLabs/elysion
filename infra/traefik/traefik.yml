api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ':80'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    # Services also join other networks (local-infra); route over this one.
    network: elysion_elysion
  # Middlewares (edge authentication): see dynamic/middlewares.yml.
  file:
    directory: '/etc/traefik/dynamic'
    watch: true

log:
  level: INFO
