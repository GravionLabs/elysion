api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ':80'
  # Prometheus metrics, on their own port so they are not reachable through the public entry point. Not published
  # by compose: a scraper on the compose network reads http://traefik:8082/metrics.
  metrics:
    address: ':8082'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    # Route over the stack's own network (the project is called `elysion`), whatever other networks a service joins.
    network: elysion_elysion
  # Middlewares (edge authentication): see dynamic/middlewares.yml.
  file:
    directory: '/etc/traefik/dynamic'
    watch: true

log:
  level: INFO

# One JSON line per request on stdout (docs/specs/gateway.md). The /yjs URL carries the WS token in its query string
# (`?board=...&token=...`) and Traefik writes `RequestPath` with the query: the query parameters are dropped (Traefik
# 3.7.3 or later), the path stays. Request headers (Authorization, Cookie) are dropped, which is also the default.
accessLog:
  format: json
  fields:
    defaultMode: keep
    queryParameters:
      defaultMode: drop
    headers:
      defaultMode: drop
  # logs:otlp (`pnpm dev:logs` replaces this line with the export to the log viewer, scripts/traefik-logs-config.mjs)

# Request counts and durations per entry point, router and service (docs/specs/gateway.md).
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
