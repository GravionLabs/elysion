# The API is not served on its own open port (`insecure: false`, #780). It is only reachable through a router to `api@internal`,
# and only docker-compose.dev.yml defines one (on the entry point `dashboard`, published on the loopback).
api:
  dashboard: true
  insecure: false

entryPoints:
  dashboard:
    address: ':8080'
  web:
    address: ':80'
    # The routers of the services name no entry point: they belong to the default ones, so `dashboard` serves only what names it.
    asDefault: true
  # Prometheus metrics, on their own port so they are not reachable through the public entry point. Not published
  # by compose: a scraper on the compose network reads http://traefik:8082/metrics.
  metrics:
    address: ':8082'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    # Route over the stack's own network (the project is called `elysion`), whatever other networks a service joins.
    network: elysion_elysion
  # Middlewares (edge authentication): see dynamic/middlewares.yml.
  file:
    directory: '/etc/traefik/dynamic'
    watch: true

log:
  level: INFO

# One JSON line per request on stdout (docs/specs/gateway.md). The /yjs URL carries the WS token in its query string
# (`?board=...&token=...`) and Traefik writes `RequestPath` with the query: the query parameters are dropped (Traefik
# 3.7.3 or later), the path stays. Request headers (Authorization, Cookie) are dropped, which is also the default, except
# `X-Request-Id` (request and response, `request_X-Request-Id`/`downstream_X-Request-Id`): a correlation key, not a secret
# (ADR 0025), with which a request is found in the access log as in the services' logs (ADR 0034).
accessLog:
  format: json
  fields:
    defaultMode: keep
    queryParameters:
      defaultMode: drop
    names:
      # An invitation link carries its secret in the path (`/invite/<token>`, `/api/invitations/<token>/accept`, #734), and Traefik
      # cannot redact part of a path: the path is not logged at all. The router and the service name say what was called.
      RequestPath: drop
    headers:
      defaultMode: drop
      names:
        X-Request-Id: keep
  # logs:otlp (`pnpm dev:logs` replaces this line with the export to the log viewer, scripts/traefik-logs-config.mjs)

# Request counts and durations per entry point, router and service (docs/specs/gateway.md).
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
