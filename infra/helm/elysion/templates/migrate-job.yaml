{{- if .Values.migrateJob.enabled }}
{{- $full := printf "%s-migrate" (include "elysion.fullname" .) }}
{{- $img := .Values.images.businessBackend }}
{{- $env := list
  (include "elysion.secretEnv" (dict "root" . "name" "ConnectionStrings__Elysion" "key" "POSTGRES_CONNECTION_STRING") | fromYaml)
  (include "elysion.secretEnv" (dict "root" . "name" "INTERNAL_API_SECRET") | fromYaml)
  (include "elysion.secretEnv" (dict "root" . "name" "S3_ACCESS_KEY") | fromYaml)
  (include "elysion.secretEnv" (dict "root" . "name" "S3_SECRET_KEY") | fromYaml)
  (dict "name" "OIDC_ISSUER_URL" "value" (required "oidc.issuerUrl is required" .Values.oidc.issuerUrl))
  (dict "name" "OIDC_AUDIENCE" "value" .Values.oidc.audience)
  (dict "name" "S3_ENDPOINT" "value" (required "objectStore.endpoint is required" .Values.objectStore.endpoint))
  (dict "name" "S3_BUCKET" "value" .Values.objectStore.bucket)
-}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}
  labels:
    {{- include "elysion.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Runs before the new Deployments are applied and the release waits for it; a failed migration stops the upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "elysion.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ $img.repository }}:{{ $img.tag }}"
          imagePullPolicy: {{ $img.pullPolicy }}
          args: ["--migrate"]
          env:
            {{- toYaml $env | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
{{- end }}
