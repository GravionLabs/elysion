{{- if not .Values.secrets.existingSecret }}{{ fail "secrets.existingSecret is empty: name the Secret that holds the keys listed in values.yaml (docs/self-hosting.md)" }}{{ end }}
{{- if .Values.secrets.create }}
# Throwaway installs only (values.yaml `secrets.create`): the values end up in the Helm release.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "elysion.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secrets.values | nindent 2 }}
{{- end }}
