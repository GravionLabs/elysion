# Defaults for every environment; values-<env>.yaml overrides what differs. Never put a secret in a committed values
# file: the secrets are referenced by name (see `secrets` below and the README).

images:
  # Built from the repository's Dockerfiles; the registry is yours to set (`kind load docker-image` for kind).
  frontend: { repository: elysion/frontend, tag: latest, pullPolicy: IfNotPresent }
  bff: { repository: elysion/bff, tag: latest, pullPolicy: IfNotPresent }
  realtime: { repository: elysion/realtime, tag: latest, pullPolicy: IfNotPresent }
  businessBackend: { repository: elysion/business-backend, tag: latest, pullPolicy: IfNotPresent }

replicas:
  frontend: 1
  bff: 1
  # More than one is fine: rooms are kept in step through Valkey (ADR 0011), no sticky sessions needed.
  realtime: 1
  businessBackend: 1

resources:
  frontend: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 128Mi } }
  bff: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 256Mi } }
  # Measured (docs/performance.md): 300 connections on a replica, each moving an element twice a second, take about 30 % of a core
  # and 175 MiB; an idle replica 55 MiB. With a request of 250m and a target of 70 % the autoscaler adds a replica at about 180 connections each.
  realtime: { requests: { cpu: 250m, memory: 256Mi }, limits: { memory: 512Mi } }
  businessBackend: { requests: { cpu: 100m, memory: 160Mi }, limits: { memory: 512Mi } }

# The identity provider (Keycloak, ADR 0014) is external: where tokens come from and what they are for.
oidc:
  # The issuer exactly as it appears in the tokens (the address the browser logs in at).
  issuerUrl: ''
  audience: elysion-bff
  clientId: elysion-frontend
  # Optional: where the services fetch the realm's keys when that differs from the issuer (e.g. a cluster-internal address).
  jwksUri: ''

# The business backend applies its migrations itself at start-up; turn off when a pipeline migrates. With more than one replica
# use the job below instead: replicas that migrate at the same time race each other.
migrateOnStartup: true

migrateJob:
  # A Helm hook (pre-install, pre-upgrade) that runs the business backend image with `--migrate` and exits; the release waits for it.
  # The Secret (existingSecret) has to exist before the first install. When on, the replicas do not migrate at start-up.
  enabled: false

# Limits of a board's document in the realtime service (ADR 0026, docs/specs/realtime.md "Limits"). The canvas limits a board to
# 20,000 elements besides (the `max-elements` attribute of the element).
limits:
  # The largest Yjs update one client may send; above it the connection is closed (1009).
  maxUpdateBytes: 2097152
  # The largest encoded state of a board; above it updates are refused with a "board full" message. Keep it below the
  # business backend's own limit of 32 MiB and the WebSocket's 16 MiB frame.
  maxDocumentBytes: 8388608
  # A board whose stored state is larger than this is rebuilt when nobody has it open (0: never).
  compactThresholdBytes: 1048576

# The realtime service scales on CPU and, with the Prometheus adapter, on its open WebSocket connections. Off: `replicas.realtime`.
autoscaling:
  realtime:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    # Needs the Prometheus adapter to serve the pod metric `elysion_realtime_websocket_connections` (docs/operations.md). 0: CPU only.
    connectionsTarget: 0

# Ingress rules per component: Traefik (its namespace below) may reach the frontend, the BFF and the realtime service; the
# business backend only the BFF and the realtime service; the monitoring namespace may scrape the three services. It is a
# NetworkPolicy, so the cluster's network plugin has to enforce them. Egress is not restricted (the external services differ).
networkPolicy:
  enabled: false
  traefikNamespace: traefik
  monitoringNamespace: monitoring

monitoring:
  # A ServiceMonitor of the Prometheus Operator for the BFF, the realtime service and the business backend.
  serviceMonitor:
    enabled: false
    interval: 30s
    # Labels the operator's Prometheus selects ServiceMonitors by (for example `release: kube-prometheus-stack`).
    labels: {}

# The object store that keeps the files of boards, the images (ADR 0007, #702): any S3-compatible service with path-style
# addressing. The business backend creates the bucket at start if it is missing, and does not start without a store it can
# reach. The access key and secret are in the Secret below.
objectStore:
  endpoint: ''
  bucket: elysion-files
  # The most a file and a board may hold (413 and 409 for the user).
  maxFileBytes: 10485760
  maxFilesPerBoard: 200

# External services are not part of this chart. Their addresses (and passwords) are in the Secret below.
secrets:
  # An existing Secret with these keys:
  #   WS_TOKEN_SECRET              HS256 secret of the board WS tokens (BFF and realtime), at least 32 characters
  #   INTERNAL_API_SECRET          HS256 secret of the internal API token (realtime and business backend), at least 32 characters, a different value
  #   POSTGRES_CONNECTION_STRING   Npgsql connection string of the business backend
  #   REDIS_URL                    redis://:<password>@host:6379 of the Valkey instance (realtime); it MUST carry a password or an ACL user (#775)
  #   S3_ACCESS_KEY, S3_SECRET_KEY  credentials of the object store (business backend); read and write on the bucket, and creating it
  existingSecret: elysion-secrets
  # For throwaway installs only: render the Secret from `values` (which then sit in the release). Off by default.
  create: false
  values: {}

edge:
  # The edge is Traefik (ADR 0001): the chart renders its Middleware and IngressRoute resources (traefik.io/v1alpha1).
  # The Traefik controller and its CRDs have to be installed in the cluster.
  enabled: true
  # The host the routes answer for; empty matches every host.
  host: ''
  entryPoints: [web]
  # Origins that get CORS headers on /api and /yjs (the app itself is same-origin and needs none).
  corsAllowedOrigins: []
  rateLimit:
    average: 50
    burst: 100
  # A Secret of type kubernetes.io/tls to terminate TLS at the entry point; empty: none. cert-manager (or your PKI) makes it; the
  # chart never talks to an ACME server (ADR 0028). One wildcard certificate can serve the application and the identity host.
  tlsSecretName: ''
  # Redirect plain HTTP to HTTPS: a second route on the `web` entry point with a permanent redirectScheme. Needs entryPoints without `web`
  # (use [websecure]) and a tlsSecretName. Off, so that the kind setup keeps working over HTTP.
  redirectToHttps: false

# Response headers (docs/specs/frontend.md, "Headers").
security:
  # The frontend's Content-Security-Policy: off, report (violations go to the BFF's log, nothing is blocked) or enforce.
  cspMode: enforce
  # Strict-Transport-Security in seconds on the frontend and the API; 0: none. Set it only when TLS is on.
  hstsMaxAge: 0
