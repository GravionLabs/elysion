# Source: elysion/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: elysion-realtime
  labels:
    app.kubernetes.io/name: elysion
    app.kubernetes.io/instance: elysion
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: elysion-0.1.0
    app.kubernetes.io/component: realtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: elysion-realtime
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    # Fewer replicas disconnect their clients (they reconnect to another one): scale down slowly.
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
