# Source: elysion/templates/bff.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elysion-bff
  labels:
    app.kubernetes.io/name: elysion
    app.kubernetes.io/instance: elysion
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: elysion-0.1.0
    app.kubernetes.io/component: bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: elysion
      app.kubernetes.io/component: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elysion
        app.kubernetes.io/instance: elysion
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: elysion-0.1.0
        app.kubernetes.io/component: bff
    spec:
      # Replicas of one component go to different nodes when they can (a node that fails takes one, not all).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: elysion
              app.kubernetes.io/component: bff
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: "ghcr.io/gravionlabs/elysion-bff:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BUSINESS_BACKEND_URL
              value: http://elysion-business-backend:8080
            - name: OIDC_ISSUER_URL
              value: https://id.example/realms/elysion
            - name: OIDC_AUDIENCE
              value: elysion-bff
            - name: WS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  key: WS_TOKEN_SECRET
                  name: elysion-secrets
          # Readiness and liveness wait for the start-up probe: the business backend migrates the database at start.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 15
          # Not routed until the service answers, and restarted when it stops answering.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
