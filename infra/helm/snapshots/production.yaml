    helm.sh/chart: elysion-0.1.0
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: elysion
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [bff, realtime, business-backend] }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
