# Source: elysion/templates/migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: elysion-migrate
  labels:
    app.kubernetes.io/name: elysion
    app.kubernetes.io/instance: elysion
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: elysion-0.1.0
    app.kubernetes.io/component: migrate
  annotations:
    # Runs before the new Deployments are applied and the release waits for it; a failed migration stops the upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elysion
        app.kubernetes.io/instance: elysion
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: elysion-0.1.0
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "ghcr.io/gravionlabs/elysion-business-backend:latest"
          imagePullPolicy: IfNotPresent
          args: ["--migrate"]
          env:
            - name: ConnectionStrings__Elysion
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_CONNECTION_STRING
                  name: elysion-secrets
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  key: INTERNAL_API_SECRET
                  name: elysion-secrets
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: S3_ACCESS_KEY
                  name: elysion-secrets
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: S3_SECRET_KEY
                  name: elysion-secrets
            - name: OIDC_ISSUER_URL
              value: https://id.example/realms/elysion
            - name: OIDC_AUDIENCE
              value: elysion-bff
            - name: S3_ENDPOINT
              value: https://s3.example
            - name: S3_BUCKET
              value: elysion-files
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
