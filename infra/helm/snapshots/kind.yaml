            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: etc-nginx-conf-d, mountPath: /etc/nginx/conf.d }
