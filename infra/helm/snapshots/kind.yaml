        app.kubernetes.io/instance: elysion
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: elysion-0.1.0
        app.kubernetes.io/component: business-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
