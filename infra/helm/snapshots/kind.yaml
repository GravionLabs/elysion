# Source: elysion/templates/edge.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: elysion
  labels:
    app.kubernetes.io/name: elysion
    app.kubernetes.io/instance: elysion
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: elysion-0.1.0
spec:
  entryPoints:
    - web
  routes:
    # Where the browser reports a Content-Security-Policy violation: no token, so no forwardAuth; the rate limit applies.
    - kind: Rule
      match: Path(`/api/csp-report`)
      priority: 100
      middlewares:
        - name: elysion-security-headers
        - name: elysion-rate-limit
      services:
        - name: elysion-bff
          port: 3000
    - kind: Rule
      match: PathPrefix(`/api`)
      middlewares:
        - name: elysion-security-headers
        - name: elysion-cors
        - name: elysion-rate-limit
        - name: elysion-bff-auth
      services:
        - name: elysion-bff
          port: 3000
    # WebSocket: the token in the URL is checked by the realtime service itself, so no forwardAuth, no rate limit.
    - kind: Rule
      match: PathPrefix(`/yjs`)
      middlewares:
        - name: elysion-security-headers
        - name: elysion-cors
      services:
        - name: elysion-realtime
          port: 3000
    - kind: Rule
      match: PathPrefix(`/`)
      priority: 1
      services:
        - name: elysion-frontend
          port: 8080
---
# Source: elysion/templates/edge.yaml
# Middlewares, in the order the routes use them (docs/specs/gateway.md): security-headers first, so that an answer the later ones give (401, 429) carries the headers, then cors, rate-limit, bff-auth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: elysion-bff-auth
  labels:
    app.kubernetes.io/name: elysion
    app.kubernetes.io/instance: elysion
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: elysion-0.1.0
spec:
  # Every /api request is first sent to the BFF's verify endpoint: 2xx lets it through, anything else is the answer.
  # The address carries the namespace: Traefik runs in its own.
  forwardAuth:
    address: http://elysion-bff.elysion.svc:3000/api/auth/verify
    authResponseHeaders: [X-Auth-User-Id, X-Auth-User-Email]
    trustForwardHeader: false
---
# Source: elysion/templates/edge.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: elysion-cors
  labels:
    app.kubernetes.io/name: elysion
    app.kubernetes.io/instance: elysion
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: elysion-0.1.0
spec:
  headers:
    accessControlAllowOriginList:
      []
    accessControlAllowMethods: [GET, POST, PATCH, PUT, DELETE, OPTIONS]
    accessControlAllowHeaders: [Authorization, Content-Type]
    accessControlExposeHeaders: [X-Request-Id]
    accessControlMaxAge: 600
    addVaryHeader: true
---
# Source: elysion/templates/edge.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: elysion-rate-limit
  labels:
    app.kubernetes.io/name: elysion
    app.kubernetes.io/instance: elysion
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: elysion-0.1.0
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1s
---
# Source: elysion/templates/edge.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: elysion-security-headers
  labels:
    app.kubernetes.io/name: elysion
    app.kubernetes.io/instance: elysion
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: elysion-0.1.0
spec:
  # The plain security headers on the API's answers (the frontend's nginx sets its own); HSTS only when hstsMaxAge is set.
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    permissionsPolicy: camera=(), microphone=(), geolocation=()
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
    stsSeconds: 0
    stsIncludeSubdomains: true
    forceSTSHeader: true
