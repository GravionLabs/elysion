                  name: elysion-secrets
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  key: INTERNAL_API_SECRET
                  name: elysion-secrets
            - name: S3_ENDPOINT
              value: http://rustfs.invalid:9100
            - name: S3_BUCKET
              value: elysion-files-kind
            - name: MAX_FILE_BYTES
              value: "10485760"
            - name: MAX_FILES_PER_BOARD
              value: "200"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: S3_ACCESS_KEY
                  name: elysion-secrets
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: S3_SECRET_KEY
                  name: elysion-secrets
          # Readiness and liveness wait for the start-up probe: the business backend migrates the database at start.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 90
