apiVersion: apps/v1
kind: Deployment
metadata:
  name: elysion-realtime
  labels:
    app.kubernetes.io/name: elysion
    app.kubernetes.io/instance: elysion
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: elysion-0.1.0
    app.kubernetes.io/component: realtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: elysion
      app.kubernetes.io/component: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elysion
        app.kubernetes.io/instance: elysion
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: elysion-0.1.0
        app.kubernetes.io/component: realtime
    spec:
      # The realtime service saves every board with unsaved changes when it gets SIGTERM (ADR 0011): give it the time.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: realtime
          image: "elysion/realtime:kind"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BUSINESS_BACKEND_URL
              value: http://elysion-business-backend:8080
            - name: MAX_UPDATE_BYTES
              value: "2097152"
            - name: MAX_DOCUMENT_BYTES
              value: "8388608"
            - name: COMPACT_THRESHOLD_BYTES
              value: "1048576"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  key: REDIS_URL
                  name: elysion-secrets
            - name: WS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  key: WS_TOKEN_SECRET
                  name: elysion-secrets
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  key: INTERNAL_API_SECRET
                  name: elysion-secrets
          # Readiness and liveness wait for the start-up probe: the business backend migrates the database at start.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 15
          # Not routed until the service answers, and restarted when it stops answering.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
