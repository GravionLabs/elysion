name: elysion-demo

# A self-contained demo: everything Elysion needs in one `docker compose up`, including its own Valkey (the same
# image and settings as ../local-infra, see below), and no dependency on local-infra. The images are built from
# this checkout. Log in at http://localhost as dev, dev1 or dev2 (the password is the username); Keycloak's admin
# console is at http://localhost:8081 (admin / admin). The identity provider is wired to `localhost`, so the demo
# is for the machine it runs on. Not a production setup: dev-mode Keycloak, development secrets.
#
#   pnpm demo           # build and start        pnpm demo:down   # stop (data is kept)
#
# The four app services have an `image` as well as a `build`: `pnpm demo` builds them from this checkout, and the
# published images (docs/self-hosting.md) run without building, as `--no-build --pull always` of `docker compose up`:
#   ELYSION_VERSION=0.1.0-beta.126 docker compose -f infra/docker/docker-compose.demo.yaml up -d --no-build --pull always
#   docker compose -f infra/docker/docker-compose.demo.yaml down -v   # stop and forget everything
#
# It uses ports 80 and 8081 like the development stack (`pnpm dev:stack`): stop that one first.

services:
  traefik:
    image: traefik:v3.7.13
    command:
      - '--configFile=/etc/traefik/traefik.yml'
    ports:
      - '80:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - elysion

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elysion
      POSTGRES_PASSWORD: elysion
      POSTGRES_DB: elysion
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elysion -d elysion']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - elysion

  # Valkey for the realtime service (presence and cross-instance sync). The image and settings are the ones of
  # ../local-infra's `valkey` (the development stack shares that one; ADR 0006), but private to this stack: a named
  # volume instead of ~/.local/share, and no host port, so it cannot clash with a Valkey on the machine.
  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - valkey-data:/data
    networks:
      - elysion

  # Creates Keycloak's own database in the existing Postgres. A script in /docker-entrypoint-initdb.d
  # would only run on an empty data volume; this is idempotent, so it also works on an existing one.
  keycloak-db:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: elysion
    command:
      - sh
      - -c
      - >-
        psql -h postgres -U elysion -d elysion -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1
        || psql -h postgres -U elysion -d elysion -c "CREATE DATABASE keycloak"
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - elysion

  # The identity provider (ADR 0014). Elysion-specific, so it lives here and not in local-infra (ADR 0006).
  # Host port 8081 because Traefik's dashboard owns 8080. The realm comes from infra/keycloak, so a clean
  # checkout has the same provider every time. Dev mode (HTTP, no hostname checks): never a production setup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: elysion
      KC_DB_PASSWORD: elysion
      KC_HTTP_PORT: '8080'
    ports:
      - '${KEYCLOAK_PORT:-8081}:8080'
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    networks:
      - elysion

  # --- Application services ---
  # Routes at the edge: /api -> bff, /yjs -> realtime, / -> frontend. The business backend has no route: only the bff
  # reaches it, at http://business-backend:8080 on the compose network.

  business-backend:
    image: ghcr.io/gravionlabs/elysion-business-backend:${ELYSION_VERSION:-next}
    build: ../../apps/business-backend
    environment:
      ConnectionStrings__Elysion: Host=postgres;Port=5432;Database=elysion;Username=elysion;Password=elysion
      Database__MigrateOnStartup: 'true'
      # Access tokens come from Keycloak (docs/specs/identity.md). The issuer is the address the browser used;
      # the keys are fetched over the compose network.
      OIDC_ISSUER_URL: http://localhost:8081/realms/elysion
      OIDC_AUDIENCE: elysion-bff
      OIDC_JWKS_URI: http://keycloak:8080/realms/elysion/protocol/openid-connect/certs
      # The realtime service's token for the internal document API is checked with this (ADR 0017). Development value only.
      INTERNAL_API_SECRET: dev-only-internal-api-secret-change-me-0123456789
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elysion

  bff:
    image: ghcr.io/gravionlabs/elysion-bff:${ELYSION_VERSION:-next}
    build:
      context: ../..
      dockerfile: apps/bff/Dockerfile
    environment:
      BUSINESS_BACKEND_URL: http://business-backend:8080
      # Keycloak is `keycloak:8080` here, while tokens carry the issuer the browser used (localhost:8081).
      OIDC_JWKS_URI: http://keycloak:8080/realms/elysion/protocol/openid-connect/certs
      WS_TOKEN_SECRET: dev-only-ws-token-secret-change-me-0123456789 # development value only
    depends_on:
      - business-backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.bff.rule=PathPrefix(`/api`)'
      # Edge authentication: the token is verified by the BFF before the request is let through (#121).
      # Order matters: CORS first (it answers a browser's preflight, which carries no token), then the rate limit
      # (an unauthenticated flood is stopped before it reaches the BFF's verify call), then authentication.
      - 'traefik.http.routers.bff.middlewares=cors,rate-limit,bff-auth@file'
      - 'traefik.http.services.bff.loadbalancer.server.port=3000'
      # CORS and rate limiting at the edge (#344, docs/specs/gateway.md). Defined here and not in the dynamic file,
      # because the file has no way to read the environment: the allowed origins and the limit are compose variables.
      # Only the listed origins get CORS headers (the app itself is same-origin and needs none). Bearer tokens, no cookies:
      # credentials stay off.
      - 'traefik.http.middlewares.cors.headers.accessControlAllowOriginList=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:4200}'
      - 'traefik.http.middlewares.cors.headers.accessControlAllowMethods=GET,POST,PATCH,PUT,DELETE,OPTIONS'
      - 'traefik.http.middlewares.cors.headers.accessControlAllowHeaders=Authorization,Content-Type'
      - 'traefik.http.middlewares.cors.headers.accessControlMaxAge=600'
      - 'traefik.http.middlewares.cors.headers.addVaryHeader=true'
      # Requests per second and client address (the burst is what may arrive at once); over it: 429.
      - 'traefik.http.middlewares.rate-limit.ratelimit.average=${RATE_LIMIT_AVERAGE:-50}'
      - 'traefik.http.middlewares.rate-limit.ratelimit.burst=${RATE_LIMIT_BURST:-100}'
      - 'traefik.http.middlewares.rate-limit.ratelimit.period=1s'
    networks:
      - elysion

  realtime:
    image: ghcr.io/gravionlabs/elysion-realtime:${ELYSION_VERSION:-next}
    build:
      context: ../..
      dockerfile: apps/realtime/Dockerfile
    environment:
      REDIS_URL: redis://valkey:6379
      # Board documents are stored by the business backend (ADR 0011); without it no board opens.
      BUSINESS_BACKEND_URL: http://business-backend:8080
      # Verifies the WS tokens the BFF issues; the same value as the BFF's. Development value only.
      WS_TOKEN_SECRET: dev-only-ws-token-secret-change-me-0123456789
      # Signs the token for the business backend's internal document API (ADR 0017); the same value as the backend's.
      INTERNAL_API_SECRET: dev-only-internal-api-secret-change-me-0123456789
    depends_on:
      - business-backend
      - valkey
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.realtime.rule=PathPrefix(`/yjs`)'
      # CORS only (defined on the bff service): a rate limit counts connects, not messages (docs/specs/gateway.md).
      - 'traefik.http.routers.realtime.middlewares=cors'
      - 'traefik.http.services.realtime.loadbalancer.server.port=3000'
    networks:
      - elysion

  frontend:
    image: ghcr.io/gravionlabs/elysion-frontend:${ELYSION_VERSION:-next}
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    environment:
      # Where the browser logs in (the address the browser uses, so localhost:8081) and as which client.
      OIDC_ISSUER_URL: http://localhost:8081/realms/elysion
      OIDC_CLIENT_ID: elysion-frontend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.frontend.rule=PathPrefix(`/`)'
      - 'traefik.http.routers.frontend.priority=1' # every more specific route wins
      - 'traefik.http.services.frontend.loadbalancer.server.port=80'
    networks:
      - elysion

networks:
  elysion:
    driver: bridge

volumes:
  postgres-data:
  valkey-data:
