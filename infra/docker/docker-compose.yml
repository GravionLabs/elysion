name: elysion

# Valkey (Redis), RabbitMQ and Portainer are shared across projects and run from
# ~/Source/gravionlabs/local-infra (`docker compose up -d` there). Do not define them here:
# apps on the host use localhost:6379, apps in containers join the external `local-infra` network.

services:
  traefik:
    image: traefik:v3.7.13
    command:
      - '--configFile=/etc/traefik/traefik.yml'
    ports:
      - '80:80'
      - '8080:8080' # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - elysion

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elysion
      POSTGRES_PASSWORD: elysion
      POSTGRES_DB: elysion
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - elysion

  # S3-compatible object store. MinIO's community images are no longer pullable (Docker Hub and
  # quay.io both deny access), so RustFS stands in with the same S3 API. Host ports are 9100/9101 because Portainer from
  # local-infra owns 9000.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: elysion
      RUSTFS_SECRET_KEY: elysion123
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${RUSTFS_S3_PORT:-9100}:9000' # S3 API
      - '${RUSTFS_CONSOLE_PORT:-9101}:9001' # console
    volumes:
      - rustfs-data:/data
    networks:
      - elysion

  # --- Routing placeholders (remove once the real services below are wired in) ---

  whoami-api:
    image: traefik/whoami
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.whoami-api.rule=PathPrefix(`/api`)'
    networks:
      - elysion

  whoami-realtime:
    image: traefik/whoami
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.whoami-realtime.rule=PathPrefix(`/realtime`)'
    networks:
      - elysion

  whoami-internal:
    image: traefik/whoami
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.whoami-internal.rule=PathPrefix(`/internal`)'
    networks:
      - elysion

  # --- Application services (uncomment/build once scaffolded) ---

  # bff:
  #   build: ../../apps/bff
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.bff.rule=PathPrefix(`/api`)"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - elysion
  #     - local-infra # reach Valkey as valkey:6379

  # realtime:
  #   build: ../../apps/realtime
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.realtime.rule=PathPrefix(`/realtime`)"
  #   networks:
  #     - elysion
  #     - local-infra # reach Valkey as valkey:6379

  # business-backend:
  #   build: ../../apps/business-backend
  #   depends_on:
  #     - postgres
  #   networks:
  #     - elysion

  # frontend:
  #   build: ../../apps/frontend
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
  #   networks:
  #     - elysion

networks:
  elysion:
    driver: bridge
  # Uncomment together with the application services above; requires local-infra to be running.
  # local-infra:
  #   external: true

volumes:
  postgres-data:
  rustfs-data:
