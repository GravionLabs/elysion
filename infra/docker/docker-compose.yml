name: elysion

services:
  traefik:
    image: traefik:v3.7.13
    command:
      - '--configFile=/etc/traefik/traefik.yml'
    ports:
      - '80:80'
      - '8080:8080' # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - elysion

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elysion
      POSTGRES_PASSWORD: elysion
      POSTGRES_DB: elysion
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - elysion

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    networks:
      - elysion

  # S3-compatible object store. MinIO's community images are no longer pullable (Docker Hub and
  # quay.io both deny access), so RustFS stands in; it speaks the same S3 API on the same ports.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: elysion
      RUSTFS_SECRET_KEY: elysion123
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${RUSTFS_S3_PORT:-9000}:9000' # S3 API
      - '${RUSTFS_CONSOLE_PORT:-9001}:9001' # console
    volumes:
      - rustfs-data:/data
    networks:
      - elysion

  # --- Routing placeholders (remove once the real services below are wired in) ---

  whoami-api:
    image: traefik/whoami
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.whoami-api.rule=PathPrefix(`/api`)'
    networks:
      - elysion

  whoami-realtime:
    image: traefik/whoami
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.whoami-realtime.rule=PathPrefix(`/realtime`)'
    networks:
      - elysion

  whoami-internal:
    image: traefik/whoami
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.whoami-internal.rule=PathPrefix(`/internal`)'
    networks:
      - elysion

  # --- Application services (uncomment/build once scaffolded) ---

  # bff:
  #   build: ../../apps/bff
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.bff.rule=PathPrefix(`/api`)"
  #   depends_on:
  #     - postgres
  #     - redis
  #   networks:
  #     - elysion

  # realtime:
  #   build: ../../apps/realtime
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.realtime.rule=PathPrefix(`/realtime`)"
  #   depends_on:
  #     - redis
  #   networks:
  #     - elysion

  # business-backend:
  #   build: ../../apps/business-backend
  #   depends_on:
  #     - postgres
  #   networks:
  #     - elysion

  # frontend:
  #   build: ../../apps/frontend
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
  #   networks:
  #     - elysion

networks:
  elysion:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
