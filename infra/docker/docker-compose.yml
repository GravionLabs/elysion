name: elysion

services:
  traefik:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - elysion

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elysion
      POSTGRES_PASSWORD: elysion
      POSTGRES_DB: elysion
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - elysion

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - elysion

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: elysion
      MINIO_ROOT_PASSWORD: elysion123
    ports:
      - "9000:9000"
      - "9001:9001" # MinIO console
    volumes:
      - minio-data:/data
    networks:
      - elysion

  # --- Application services (uncomment/build once scaffolded) ---

