name: elysion

# Valkey (Redis), RabbitMQ and Portainer are shared across projects and run from
# ~/Source/gravionlabs/local-infra (`docker compose up -d` there). Do not define them here:
# apps on the host use localhost:6379, apps in containers join the external `local-infra` network.

services:
  traefik:
    image: traefik:v3.7.13
    command:
      - '--configFile=/etc/traefik/traefik.yml'
    ports:
      - '80:80'
      - '8080:8080' # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - elysion

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elysion
      POSTGRES_PASSWORD: elysion
      POSTGRES_DB: elysion
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elysion -d elysion']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - elysion

  # S3-compatible object store. MinIO's community images are no longer pullable (Docker Hub and
  # quay.io both deny access), so RustFS stands in with the same S3 API. Host ports are 9100/9101 because Portainer from
  # local-infra owns 9000.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: elysion
      RUSTFS_SECRET_KEY: elysion123
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${RUSTFS_S3_PORT:-9100}:9000' # S3 API
      - '${RUSTFS_CONSOLE_PORT:-9101}:9001' # console
    volumes:
      - rustfs-data:/data
    networks:
      - elysion

  # Creates Keycloak's own database in the existing Postgres. A script in /docker-entrypoint-initdb.d
  # would only run on an empty data volume; this is idempotent, so it also works on an existing one.
  keycloak-db:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: elysion
    command:
      - sh
      - -c
      - >-
        psql -h postgres -U elysion -d elysion -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1
        || psql -h postgres -U elysion -d elysion -c "CREATE DATABASE keycloak"
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - elysion

  # The identity provider (ADR 0014). Elysion-specific, so it lives here and not in local-infra (ADR 0006).
  # Host port 8081 because Traefik's dashboard owns 8080. The realm comes from infra/keycloak, so a clean
  # checkout has the same provider every time. Dev mode (HTTP, no hostname checks): never a production setup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: elysion
      KC_DB_PASSWORD: elysion
      KC_HTTP_PORT: '8080'
    ports:
      - '${KEYCLOAK_PORT:-8081}:8080'
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    networks:
      - elysion

  # --- Application services ---
  # Behind the `apps` profile: `pnpm dev:infra` starts only the infrastructure above (for running the
  # apps on the host), `pnpm dev:stack` adds these. Needs local-infra running (Valkey, ADR 0006).
  # Routes at the edge: /api -> bff, /yjs -> realtime, / -> frontend. The business backend has no
  # route: only the bff reaches it, at http://business-backend:8080 on the compose network.

  business-backend:
    profiles: [apps]
    build: ../../apps/business-backend
    environment:
      ConnectionStrings__Elysion: Host=postgres;Port=5432;Database=elysion;Username=elysion;Password=elysion
      Database__MigrateOnStartup: 'true'
      # Access tokens come from Keycloak (docs/specs/identity.md). The issuer is the address the browser used;
      # the keys are fetched over the compose network.
      OIDC_ISSUER_URL: http://localhost:8081/realms/elysion
      OIDC_AUDIENCE: elysion-bff
      OIDC_JWKS_URI: http://keycloak:8080/realms/elysion/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elysion

  bff:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: apps/bff/Dockerfile
    environment:
      BUSINESS_BACKEND_URL: http://business-backend:8080
      # Keycloak is `keycloak:8080` here, while tokens carry the issuer the browser used (localhost:8081).
      OIDC_JWKS_URI: http://keycloak:8080/realms/elysion/protocol/openid-connect/certs
      WS_TOKEN_SECRET: dev-only-ws-token-secret-change-me-0123456789 # development value only
    depends_on:
      - business-backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.bff.rule=PathPrefix(`/api`)'
      # Edge authentication: the token is verified by the BFF before the request is let through (#121).
      - 'traefik.http.routers.bff.middlewares=bff-auth@file'
      - 'traefik.http.services.bff.loadbalancer.server.port=3000'
    networks:
      - elysion

  realtime:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: apps/realtime/Dockerfile
    environment:
      REDIS_URL: redis://valkey:6379
      # Board documents are stored by the business backend (ADR 0011); without it no board opens.
      BUSINESS_BACKEND_URL: http://business-backend:8080
      # Verifies the WS tokens the BFF issues; the same value as the BFF's. Development value only.
      WS_TOKEN_SECRET: dev-only-ws-token-secret-change-me-0123456789
    depends_on:
      - business-backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.realtime.rule=PathPrefix(`/yjs`)'
      - 'traefik.http.services.realtime.loadbalancer.server.port=3000'
    networks:
      - elysion
      - local-infra # reach Valkey as valkey:6379

  frontend:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.frontend.rule=PathPrefix(`/`)'
      - 'traefik.http.routers.frontend.priority=1' # every more specific route wins
      - 'traefik.http.services.frontend.loadbalancer.server.port=80'
    networks:
      - elysion

networks:
  elysion:
    driver: bridge
  # Created by ../local-infra; only the services behind the `apps` profile join it.
  local-infra:
    external: true
    name: local-infra

volumes:
  postgres-data:
  rustfs-data:
