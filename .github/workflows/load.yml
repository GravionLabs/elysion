name: Load test

# The short variant of the realtime load test (apps/load, docs/performance.md): 20 clients on two boards for a minute against
# two realtime replicas, failing when the p95 of the propagation latency is over the threshold in apps/load/scenarios/smoke.json
# or when a client's last write is missing from the final documents. Weekly and on demand; the full scenarios are run by hand
# (`pnpm test:load -- --scenario one-board`).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      scenario:
        description: The scenario in apps/load/scenarios to run
        default: smoke

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: Realtime load test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack with two realtime replicas
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.load.yml up -d --build
      - name: Wait for the stack
        run: |
          timeout 300 bash -c 'until curl -sf http://localhost:8081/realms/elysion >/dev/null; do sleep 3; done'
          timeout 300 bash -c 'until bash scripts/demo-smoke.sh >/dev/null 2>&1; do sleep 5; done'
      - name: Run the scenario
        run: pnpm test:load -- --scenario "$SCENARIO"
        env:
          COMPOSE_DIR: ${{ github.workspace }}
          SCENARIO: ${{ inputs.scenario || 'smoke' }}
      - name: The report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-report
          path: apps/load/reports/
          if-no-files-found: ignore
      - name: Logs of the services
        if: failure()
        run: docker compose logs --no-color --tail=100 realtime bff business-backend
