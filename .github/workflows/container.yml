name: Container

# The release publishes the images (see `release` in ci.yml). A pull request that touches what goes into them, or the
# demo stack, has to prove that the four images build and that the whole demo stack starts and works.
on:
  pull_request:
    paths:
      - apps/**
      - packages/**
      - docker-compose*.yml
      - infra/backup/**
      - scripts/restore.sh
      - scripts/backup-rehearsal.sh
      - .env.example
      - infra/traefik/**
      - infra/keycloak/**
      - infra/helm/**
      - infra/kind/**
      - scripts/demo-smoke.sh
      - scripts/fill-stack.mjs
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Build the images and start the stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Builds the four images from the checkout and starts the stack (`pnpm demo`).
      - name: Start the demo stack
        run: docker compose up -d --build
      # The app is served, the three demo users log in, the API answers, a board is made and a realtime token issued.
      - name: Check that it works
        run: bash scripts/demo-smoke.sh
      # The backup is only worth something if a restore brings the data back: two boards (one with an image) are made, backed
      # up, destroyed together with the databases and the bucket's files, restored and checked (scripts/backup-rehearsal.sh).
      - name: Backup and restore rehearsal
        run: bash scripts/backup-rehearsal.sh
      - name: The backup of the rehearsal
        if: failure()
        run: docker compose --profile backup run --rm --no-deps --entrypoint sh backup -c 'ls -la /backups; cat /backups/last-success' || true
      # Two browsers on one board: sharing, the shared timer, the dot voting, a viewer's limits (apps/e2e).
      - name: Install the browser tests
        run: |
          pnpm install --frozen-lockfile --filter @elysion/e2e...
          pnpm --filter @elysion/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:browser
      - name: Report of the browser tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          if-no-files-found: ignore
      - name: Logs of the services
        if: failure()
        run: docker compose logs --no-color --tail=80

  # The Helm chart on a real (kind) cluster, with the images of this checkout: the production switches (migration job, two
  # backend replicas, network policies) on, the smoke script of the demo against it, an upgrade, and a check that no pod runs
  # as root. Postgres, Keycloak and the object store are the compose stack's, as in infra/kind/README.md. kind, helm and
  # kubectl are on the runner's image.
  kind:
    name: The Helm chart on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HELM_ARGS: --set migrateJob.enabled=true --set replicas.businessBackend=2 --set networkPolicy.enabled=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Keycloak listens on all interfaces: the cluster's pods fetch its keys through the host's address.
      - name: Postgres, Keycloak and the object store
        env:
          KEYCLOAK_BIND: 0.0.0.0
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres keycloak-db keycloak rustfs
          timeout 240 bash -c 'until curl -sf http://localhost:8081/realms/elysion >/dev/null; do sleep 3; done'
      - name: The cluster, the images and the chart
        run: bash infra/kind/deploy.sh up
      - name: Check that it works
        run: bash scripts/demo-smoke.sh
      # A changed value is an upgrade: the hook job runs again (it finds nothing to migrate) and the pods roll.
      - name: Upgrade
        run: |
          helm upgrade elysion infra/helm/elysion -n elysion --reuse-values --set replicas.bff=2 --wait --timeout 5m
          bash scripts/demo-smoke.sh
      - name: No pod runs as root
        run: |
          for pod in $(kubectl -n elysion get pods --field-selector=status.phase=Running -o name); do
            uid="$(kubectl -n elysion exec "$pod" -- id -u)"
            echo "$pod runs as uid $uid"
            [ "$uid" != "0" ]
          done
      - name: State of the cluster
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n elysion describe pods | tail -150
          kubectl -n elysion logs --all-containers --prefix --tail=60 -l app.kubernetes.io/instance=elysion || true
          kubectl -n elysion get jobs

  # Every pull request is an upgrade from the last published pre-release (ADR 0021): that version's stack is filled with data,
  # backed up, switched to the images of this checkout on the same volumes, and everything has to be there (scripts/fill-stack.mjs).
  upgrade:
    name: Upgrade from the last published version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read # the published images are private until their visibility is set to public (ADR 0021)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter .
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # `next` is the last pre-release: the compose file's default tag. Nothing is built here.
      - name: Start the last published version
        run: |
          docker compose pull bff realtime business-backend frontend
          docker compose up -d --no-build
          bash scripts/demo-smoke.sh
      - name: Fill it with data
        run: node scripts/fill-stack.mjs fill fill-manifest.json
      # What a failed upgrade is restored from (#684).
      - name: Back up
        run: docker compose --profile backup run --rm backup backup.sh
      - name: Switch to the images of this checkout, on the same volumes
        run: |
          docker compose build bff realtime business-backend frontend
          docker compose up -d
      - name: Check that everything is still there
        run: |
          bash scripts/demo-smoke.sh
          node scripts/fill-stack.mjs verify fill-manifest.json
      - name: Logs of the services
        if: failure()
        run: docker compose logs --no-color --tail=100
