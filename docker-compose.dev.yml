# For working on Elysion: `docker compose -f docker-compose.yml -f docker-compose.dev.yml ...` (`pnpm dev:infra` and
# `pnpm dev:stack` do that). It only adds what an app running on the host, or a tool, needs to reach the services, so
# the plain docker-compose.yml does not publish a database. See docs/adr/0023-own-valkey-one-compose-file.md.
services:
  traefik:
    ports:
      - '8080:8080' # the dashboard

  postgres:
    ports:
      - '5432:5432'

  # 6380, not 6379: a Valkey of local-infra (or any other) on the machine may own 6379. The host apps use
  # REDIS_URL=redis://localhost:6380 (apps/realtime/.env.example).
  valkey:
    ports:
      - '127.0.0.1:${VALKEY_PORT:-6380}:6379'

  # S3-compatible object store, reserved for exports and uploads (ADR 0007); no app uses it yet. Host ports 9100 and
  # 9101 because Portainer from local-infra may own 9000.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: elysion
      RUSTFS_SECRET_KEY: elysion123
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${RUSTFS_S3_PORT:-9100}:9000' # S3 API
      - '${RUSTFS_CONSOLE_PORT:-9101}:9001' # console
    volumes:
      - rustfs-data:/data
    networks:
      - elysion

volumes:
  rustfs-data:
