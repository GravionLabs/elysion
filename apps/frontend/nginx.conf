# A template: the official nginx image replaces ${VARIABLES} from the environment when the container starts
# (Dockerfile: /etc/nginx/templates), so one image runs against any identity provider.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Response headers every page and file carries. A Content-Security-Policy is not set yet: the app needs a
  # tested policy for Excalidraw's inline styles and the identity provider's origin (docs/self-hosting.md).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  # Where to log in, for the app to read when it starts (OIDC_ISSUER_URL and OIDC_CLIENT_ID of the container).
  # An exact match wins over the static public/auth-config.json that `ng serve` uses.
  location = /auth-config.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    return 200 '{"authority":"${OIDC_ISSUER_URL}","clientId":"${OIDC_CLIENT_ID}"}';
  }

  # The web app manifest: nginx's default types do not know .webmanifest.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
