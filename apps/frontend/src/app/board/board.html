<app-top-bar
  [boardId]="boardId()"
  [boardName]="boardName()"
  [status]="syncStatus()"
  [theme]="theme()"
  [libraryOpen]="libraryOpen()"
  [hasSelection]="selectionCount() > 0"
  (themeToggle)="toggleTheme()"
  (libraryToggle)="toggleLibrary()"
  (exportRequested)="exportBoard($event)"
  (importChosen)="chooseImport($event)"
/>
@if (pendingImport(); as file) {
  <div class="board-banner confirm" role="alertdialog" aria-label="Confirm import">
    <span>Replace everything on this board with “{{ file.name }}”?</span>
    <button type="button" class="banner-button primary" (click)="confirmImport()">Replace</button>
    <button type="button" class="banner-button" (click)="cancelImport()">Cancel</button>
  </div>
} @else if (notice(); as message) {
  <div class="board-banner" role="status">
    <span>{{ message }}</span>
    <button type="button" class="banner-button" (click)="dismissNotice()">Dismiss</button>
  </div>
}
<elysion-canvas
  #canvas
  class="board-canvas"
  [attr.board-id]="boardId()"
  [attr.yjs-server-url]="yjsServerUrl()"
  [attr.theme]="theme()"
  (ready)="onCanvasReady()"
  (error)="onCanvasError()"
  (status)="onSyncStatus($event)"
  (themechange)="onCanvasThemeChange($event)"
  (librarychange)="onLibraryChange($event)"
  (selectioncount)="onSelectionCount($event)"
></elysion-canvas>
