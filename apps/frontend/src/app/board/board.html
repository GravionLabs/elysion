<app-top-bar
  [boardId]="boardId()"
  [boardName]="boardName()"
  [status]="syncStatus()"
  [theme]="theme()"
  [libraryOpen]="libraryOpen()"
  (themeToggle)="toggleTheme()"
  (libraryToggle)="toggleLibrary()"
/>
<elysion-canvas
  #canvas
  class="board-canvas"
  [attr.board-id]="boardId()"
  [attr.yjs-server-url]="yjsServerUrl()"
  [attr.theme]="theme()"
  (ready)="onCanvasReady()"
  (error)="onCanvasError()"
  (status)="onSyncStatus($event)"
  (themechange)="onCanvasThemeChange($event)"
  (librarychange)="onLibraryChange($event)"
></elysion-canvas>
