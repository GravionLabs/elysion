<button
  type="button"
  class="menu-button"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-busy]="busy() !== null"
  title="Export the board"
  i18n-title="@@topbar.export.button-title"
  (click)="toggle()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 3v12m0 0-4-4m4 4 4-4M5 20h14" />
  </svg>
  @if (busyLabel(); as label) {
    <span>{{ label }}</span>
  } @else {
    <span i18n="@@topbar.export.button">Export</span>
  }
</button>

@if (open()) {
  <div class="menu" role="menu" aria-label="Export" i18n-aria-label="@@topbar.export.menu">
    @for (item of formats; track item.format) {
      <button
        type="button"
        class="menu-item"
        role="menuitem"
        [disabled]="busy() !== null"
        (click)="choose(item.format)"
      >
        {{ item.label }}
      </button>
    }
    <label class="menu-option" [class.disabled]="!hasSelection()">
      <input
        type="checkbox"
        role="menuitemcheckbox"
        [disabled]="!hasSelection()"
        [checked]="selectionOnly() && hasSelection()"
        (change)="setSelectionOnly($event)"
      />
      <span i18n="@@topbar.export.selection-only">Selection only</span>
    </label>
    <fieldset class="menu-settings">
      <legend i18n="@@topbar.export.options">Options</legend>
      <label>
        <span i18n="@@topbar.export.pdf-pages">PDF pages</span>
        <select (change)="change('pdfPages', $any(pick($event)))">
          @for (choice of pdfPagesChoices; track choice.value) {
            <option [value]="choice.value" [selected]="settings().pdfPages === choice.value">
              {{ choice.label }}
            </option>
          }
        </select>
      </label>
      <label>
        <span i18n="@@topbar.export.page-size">Page size</span>
        <select (change)="change('pageFormat', $any(pick($event)))">
          @for (choice of pageFormatChoices; track choice.value) {
            <option [value]="choice.value" [selected]="settings().pageFormat === choice.value">
              {{ choice.label }}
            </option>
          }
        </select>
      </label>
      <label>
        <span i18n="@@topbar.export.orientation">Orientation</span>
        <select (change)="change('orientation', $any(pick($event)))">
          @for (choice of orientationChoices; track choice.value) {
            <option [value]="choice.value" [selected]="settings().orientation === choice.value">
              {{ choice.label }}
            </option>
          }
        </select>
      </label>
      <label>
        <span i18n="@@topbar.export.colors">Colors</span>
        <select (change)="change('colors', $any(pick($event)))">
          @for (choice of colorChoices; track choice.value) {
            <option [value]="choice.value" [selected]="settings().colors === choice.value">
              {{ choice.label }}
            </option>
          }
        </select>
      </label>
      <label>
        <span i18n="@@topbar.export.scale">PNG scale</span>
        <select (change)="change('scale', +pick($event) === 3 ? 3 : +pick($event) === 2 ? 2 : 1)">
          @for (choice of scaleChoices; track choice.value) {
            <option [value]="choice.value" [selected]="settings().scale === choice.value">
              {{ choice.label }}
            </option>
          }
        </select>
      </label>
      <label class="menu-check">
        <input
          type="checkbox"
          [checked]="settings().background"
          (change)="change('background', $any($event.target).checked)"
        />
        <span i18n="@@topbar.export.background">Background</span>
      </label>
    </fieldset>
  </div>
}
