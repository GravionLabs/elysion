@if (timer(); as current) {
  <div class="timer-group">
    <span
      class="chip"
      role="timer"
      aria-live="off"
      [class.paused]="paused()"
      [class.ended]="ended()"
      [title]="startedByLabel()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="13" r="7" />
        <path d="M12 9v4l2.5 1.5M9.5 3h5" />
      </svg>
      <span class="clock">{{ clock() }}</span>
      @if (paused()) {
        <span class="state" i18n="@@topbar.timer.paused">paused</span>
      }
    </span>

    @if (canControl()) {
      @if (paused()) {
        <button
          type="button"
          class="icon-button resume"
          aria-label="Resume the timer"
          i18n-aria-label="@@topbar.timer.resume-aria"
          title="Resume"
          i18n-title="@@topbar.timer.resume-title"
          (click)="resumeRequested.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
        </button>
      } @else {
        <button
          type="button"
          class="icon-button pause"
          aria-label="Pause the timer"
          i18n-aria-label="@@topbar.timer.pause-aria"
          title="Pause"
          i18n-title="@@topbar.timer.pause-title"
          (click)="pauseRequested.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
        </button>
      }
      <button
        type="button"
        class="icon-button extend"
        aria-label="Add one minute to the timer"
        i18n-aria-label="@@topbar.timer.extend-aria"
        title="Add one minute"
        i18n-title="@@topbar.timer.extend-title"
        (click)="extendRequested.emit(60000)"
      >
        +1
      </button>
      <button
        type="button"
        class="icon-button stop"
        aria-label="Stop the timer"
        i18n-aria-label="@@topbar.timer.stop-aria"
        title="Stop the timer for everybody"
        i18n-title="@@topbar.timer.stop-title"
        (click)="stopRequested.emit()"
      >
        <svg class="stop-square" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2" />
        </svg>
      </button>
    }

    <button
      type="button"
      class="icon-button mute"
      [attr.aria-pressed]="muted()"
      [attr.aria-label]="muteLabel()"
      [title]="muteTitle()"
      (click)="toggleMute()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 9v6h4l5 4V5L9 9z" />
        @if (muted()) {
          <path d="M17 9l4 6m0-6-4 6" />
        } @else {
          <path d="M17.5 9a4 4 0 0 1 0 6" />
        }
      </svg>
    </button>
  </div>
} @else if (canControl()) {
  <button
    type="button"
    class="menu-button"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    title="Start a timer for everybody on this board"
    i18n-title="@@topbar.timer.button-title"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="13" r="7" />
      <path d="M12 9v4l2.5 1.5M9.5 3h5" />
    </svg>
    <span i18n="@@topbar.timer.button">Timer</span>
  </button>

  @if (open()) {
    <form
      class="menu"
      role="group"
      aria-label="Start a timer"
      i18n-aria-label="@@topbar.timer.form"
      (submit)="$event.preventDefault(); start()"
    >
      <div class="presets">
        @for (preset of presets; track preset) {
          <button
            type="button"
            class="preset"
            [class.selected]="minutes() === '' + preset"
            [attr.aria-pressed]="minutes() === '' + preset"
            i18n="@@topbar.timer.preset"
            (click)="pick(preset)"
          >
            {{ preset }} min
          </button>
        }
      </div>
      <div class="custom">
        <label for="timer-minutes" i18n="@@topbar.timer.minutes">Minutes</label>
        <input
          id="timer-minutes"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          [value]="minutes()"
          [attr.aria-invalid]="error() ? 'true' : null"
          (input)="updateMinutes($event)"
        />
        <button type="submit" class="start" i18n="@@topbar.timer.start">Start</button>
      </div>
      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }
      <label class="mute-option">
        <input type="checkbox" [checked]="muted()" (change)="toggleMute()" />
        <span i18n="@@topbar.timer.mute">Mute the end chime</span>
      </label>
    </form>
  }
}
