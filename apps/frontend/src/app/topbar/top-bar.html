<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">E</span>
    <span class="app-title">Elysion</span>
  </div>

  <span class="topbar-divider" aria-hidden="true"></span>

  <h1 class="board-title" [title]="boardId()">{{ title() }}</h1>

  <span class="status" [attr.data-status]="status()" role="status">
    <span class="status-dot" aria-hidden="true"></span>{{ statusLabel() }}
  </span>

  <div class="topbar-end">
    <button
      type="button"
      class="menu-button theme-toggle"
      [title]="themeTitle()"
      [attr.aria-label]="themeTitle()"
      (click)="themeToggle.emit()"
    >
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <span>Light</span>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg>
        <span>Dark</span>
      }
    </button>
  </div>
</header>
