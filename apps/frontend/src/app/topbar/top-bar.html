<header class="topbar">
  <app-brand />

  <span class="topbar-divider" aria-hidden="true"></span>

  <a class="menu-button all-boards" routerLink="/" title="Back to all boards">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" />
    </svg>
    <span>All boards</span>
  </a>

  <h1 class="board-title" [title]="boardId()">
    @if (editing()) {
      <input
        #titleInput
        class="title-input"
        type="text"
        autocomplete="off"
        data-1p-ignore
        data-lpignore="true"
        aria-label="Board name"
        [attr.maxlength]="maxNameLength"
        [value]="draft()"
        [attr.aria-invalid]="nameError() ? 'true' : null"
        [attr.aria-describedby]="nameError() ? 'title-error' : null"
        (input)="updateDraft($event)"
        (keydown.enter)="submitRename()"
        (keydown.escape)="cancelRename()"
        (blur)="blurRename()"
      />
    } @else if (canRename()) {
      <button
        type="button"
        class="title-button"
        aria-label="Rename the board {{ title() }}"
        (click)="startRename()"
      >
        {{ title() }}
      </button>
    } @else {
      {{ title() }}
    }
  </h1>
  @if (nameError(); as message) {
    <span id="title-error" class="title-error" role="alert">{{ message }}</span>
  }

  <span class="status" [attr.data-status]="status()" role="status">
    <span class="status-dot" aria-hidden="true"></span>{{ statusLabel() }}
  </span>

  <div class="topbar-actions">
    <input
      #importInput
      type="file"
      accept=".excalidraw,.json,application/json"
      class="visually-hidden"
      tabindex="-1"
      aria-hidden="true"
      (change)="chooseImport($event)"
    />
    <button
      type="button"
      class="menu-button import-button"
      title="Import an .excalidraw file into this board"
      (click)="importInput.click()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15V3m0 0L8 7m4-4 4 4M5 20h14" />
      </svg>
      <span>Import</span>
    </button>
    <app-export-menu
      [hasSelection]="hasSelection()"
      (exportRequested)="exportRequested.emit($event)"
    />
  </div>

  <div class="topbar-end">
    <button
      type="button"
      class="menu-button library-toggle"
      [class.active]="libraryOpen()"
      [attr.aria-pressed]="libraryOpen()"
      title="Show or hide the shape library"
      (click)="libraryToggle.emit()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"
        />
      </svg>
      <span>Library</span>
    </button>
    <button
      type="button"
      class="menu-button theme-toggle"
      [title]="themeTitle()"
      [attr.aria-label]="themeTitle()"
      (click)="themeToggle.emit()"
    >
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <span>Light</span>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg>
        <span>Dark</span>
      }
    </button>
  </div>
</header>
