packages:
  - 'apps/frontend'
  - 'apps/frontend-canvas'
  - 'apps/bff'
  - 'apps/realtime'
  - 'apps/site'
  - 'apps/e2e'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  # jspdf's optional dependency; its postinstall only prints a funding message
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  # The root `prepare` script installs the hook, so its postinstall is not needed.
  simple-git-hooks: false

onlyBuiltDependencies:
  - '@parcel/watcher'
  - 'esbuild'
  - 'lmdb'
  - 'msgpackr-extract'

# Transitive dependencies with advisories (pnpm audit --prod): the patched release inside the same major, until the
# packages that pull them in (NestJS, Excalidraw, mermaid, jspdf) update. Remove an entry when audit no longer needs it.
overrides:
  'nanoid@<3.3.18': '^3.3.18'
  'nanoid@>=4 <5.1.16': '^5.1.16'
  'lodash-es@<4.18.1': '^4.18.1'
  'multer@<2.3.0': '^2.3.0'
  'proxy-addr@<2.0.8': '^2.0.8'
  'source-map-js@<1.2.2': '^1.2.2'
  'dompurify@<3.4.16': '^3.4.16'
  'katex@<0.18.2': '^0.18.2'
