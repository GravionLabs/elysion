packages:
  - 'apps/frontend'
  - 'apps/frontend-canvas'
  - 'apps/bff'
  - 'apps/realtime'
  - 'apps/site'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  # jspdf's optional dependency; its postinstall only prints a funding message
  core-js: false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  # The root `prepare` script installs the hook, so its postinstall is not needed.
  simple-git-hooks: false

onlyBuiltDependencies:
  - '@parcel/watcher'
  - 'esbuild'
  - 'lmdb'
  - 'msgpackr-extract'
