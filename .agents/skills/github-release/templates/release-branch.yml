# Pushes to a release branch, handled by the reusable workflow release-branch.yml of GravionLabs/ci: keeps the release PR
# open and current, closes the issues merged into the branch and syncs
# the project field Needs. Replace project-url with your project; empty disables the Needs sync.
# GH_PAT: classic PAT with scope `repo` (a PR created with the GITHUB_TOKEN triggers no required checks).
# PROJECT_TOKEN (optional): classic PAT with scope `project`, falls back to GH_PAT.
name: Release branch

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only list the issues that would be closed
        type: boolean
        default: true

permissions: {}

jobs:
  release-branch:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: GravionLabs/ci/.github/workflows/release-branch.yml@v1
    with:
      project-url: https://github.com/users/<owner>/projects/<n>
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
